<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basic Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #0f172a;
    }

    .calculator {
      background: #1e293b;
      width: 100%;
      max-width: 340px;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
    }

    /* Display Screen */
    .display {
      background: #0f172a;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
      text-align: right;
      overflow: hidden;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .previous-operand {
      color: #94a3b8;
      font-size: 0.95rem;
      min-height: 1.2rem;
      word-break: break-all;
    }

    .current-operand {
      color: #f8fafc;
      font-size: 2rem;
      font-weight: 600;
      word-break: break-all;
    }

    /* CSS Grid for Button Alignment */
    .buttons-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      padding: 16px 0;
      font-size: 1.2rem;
      font-weight: 500;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #334155;
      color: #f8fafc;
      transition: background 0.15s ease, transform 0.05s ease;
      user-select: none;
    }

    button:hover {
      background: #475569;
    }

    button:active {
      transform: scale(0.97);
    }

    .span-two {
      grid-column: span 2;
    }

    .btn-clear {
      background: #dc2626;
      color: #ffffff;
    }

    .btn-clear:hover {
      background: #ef4444;
    }

    .btn-operator {
      background: #2563eb;
      color: #ffffff;
    }

    .btn-operator:hover {
      background: #3b82f6;
    }

    .btn-equals {
      background: #16a34a;
      color: #ffffff;
    }

    .btn-equals:hover {
      background: #22c55e;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <div class="display">
      <div id="previousOperand" class="previous-operand"></div>
      <div id="currentOperand" class="current-operand">0</div>
    </div>

    <!-- Buttons laid out using CSS Grid -->
    <div class="buttons-grid">
      <button class="btn-clear span-two" data-action="all-clear">AC</button>
      <button data-action="delete">DEL</button>
      <button class="btn-operator" data-operator="÷">÷</button>

      <button data-number="7">7</button>
      <button data-number="8">8</button>
      <button data-number="9">9</button>
      <button class="btn-operator" data-operator="×">×</button>

      <button data-number="4">4</button>
      <button data-number="5">5</button>
      <button data-number="6">6</button>
      <button class="btn-operator" data-operator="-">-</button>

      <button data-number="1">1</button>
      <button data-number="2">2</button>
      <button data-number="3">3</button>
      <button class="btn-operator" data-operator="+">+</button>

      <button data-number=".">.</button>
      <button data-number="0">0</button>
      <button class="btn-equals span-two" data-action="calculate">=</button>
    </div>
  </div>

  <script>
    // State variables
    let currentInput = "0";
    let previousInput = "";
    let selectedOperator = null;
    let shouldResetDisplay = false;

    const currentOperandText = document.getElementById("currentOperand");
    const previousOperandText = document.getElementById("previousOperand");

    function updateDisplay() {
      currentOperandText.textContent = currentInput;
      if (selectedOperator !== null) {
        previousOperandText.textContent = `${previousInput} ${selectedOperator}`;
      } else {
        previousOperandText.textContent = "";
      }
    }

    function appendNumber(number) {
      if (shouldResetDisplay) {
        currentInput = "";
        shouldResetDisplay = false;
      }

      // Prevent multiple decimals
      if (number === "." && currentInput.includes(".")) return;

      // Replace initial 0 with the number unless it's a decimal point
      if (currentInput === "0" && number !== ".") {
        currentInput = number;
      } else {
        currentInput += number;
      }
      updateDisplay();
    }

    function chooseOperator(operator) {
      if (currentInput === "") return;

      // If an operator is already picked, calculate intermediate result
      if (previousInput !== "") {
        compute();
      }

      selectedOperator = operator;
      previousInput = currentInput;
      shouldResetDisplay = true;
      updateDisplay();
    }

    function compute() {
      let computation;
      const prev = parseFloat(previousInput);
      const current = parseFloat(currentInput);

      if (isNaN(prev) || isNaN(current)) return;

      // Evaluation using if-else logic and math operators
      if (selectedOperator === "+") {
        computation = prev + current;
      } else if (selectedOperator === "-") {
        computation = prev - current;
      } else if (selectedOperator === "×") {
        computation = prev * current;
      } else if (selectedOperator === "÷") {
        if (current === 0) {
          alert("Cannot divide by zero");
          clearAll();
          return;
        }
        computation = prev / current;
      } else {
        return;
      }

      // Fix potential floating point issues (e.g., 0.1 + 0.2)
      currentInput = Math.round(computation * 100000000) / 100000000 + "";
      selectedOperator = null;
      previousInput = "";
      shouldResetDisplay = true;
      updateDisplay();
    }

    function deleteLastDigit() {
      if (shouldResetDisplay) return;

      if (currentInput.length === 1 || (currentInput.length === 2 && currentInput.startsWith("-"))) {
        currentInput = "0";
      } else {
        currentInput = currentInput.slice(0, -1);
      }
      updateDisplay();
    }

    function clearAll() {
      currentInput = "0";
      previousInput = "";
      selectedOperator = null;
      shouldResetDisplay = false;
      updateDisplay();
    }

    // Attach Event Listeners using a loop over all buttons
    const buttons = document.querySelectorAll("button");
    buttons.forEach((button) => {
      button.addEventListener("click", () => {
        const number = button.getAttribute("data-number");
        const operator = button.getAttribute("data-operator");
        const action = button.getAttribute("data-action");

        if (number !== null) {
          appendNumber(number);
        } else if (operator !== null) {
          chooseOperator(operator);
        } else if (action === "calculate") {
          compute();
        } else if (action === "all-clear") {
          clearAll();
        } else if (action === "delete") {
          deleteLastDigit();
        }
      });
    });

    // Keyboard support
    window.addEventListener("keydown", (e) => {
      if ((e.key >= "0" && e.key <= "9") || e.key === ".") {
        appendNumber(e.key);
      } else if (e.key === "+" || e.key === "-") {
        chooseOperator(e.key);
      } else if (e.key === "*") {
        chooseOperator("×");
      } else if (e.key === "/") {
        e.preventDefault();
        chooseOperator("÷");
      } else if (e.key === "Enter" || e.key === "=") {
        compute();
      } else if (e.key === "Backspace") {
        deleteLastDigit();
      } else if (e.key === "Escape") {
        clearAll();
      }
    });
  </script>
</body>
</html>
